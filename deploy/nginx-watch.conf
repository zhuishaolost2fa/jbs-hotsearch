# 把监听大盘挂到公网用的 nginx 配置片段。
#
# 背景：watch 容器只监听服务器本机的 8787，而 8787 在云安全组里没放行
# （也不建议放行 —— 页面里有 Supabase 错误信息、内部 URL、剧本名）。
# 所以借道已经在跑的 jbs-nginx（80 端口，对外服务 /hotsearch/ 榜单页）做反代。
#
# 用法：
#   1. 把下面那个 location 块插进 /opt/jbs/deploy/nginx.conf 的 server{ } 里，
#      位置必须在 `location / {...}`（SPA fallback）之前，否则会被它吃掉。
#   2. 口令文件注入容器（容器里没有 htpasswd 命令，在宿主机生成后 cp 进去）：
#        PW=$(openssl rand -base64 9 | tr -d "/+=")
#        echo "jbs:$(openssl passwd -apr1 "$PW")" \
#          | sudo tee /opt/jbs-hotsearch/deploy/nginx-watch.htpasswd
#        sudo docker cp /opt/jbs-hotsearch/deploy/nginx-watch.htpasswd \
#          jbs-nginx:/etc/nginx/watch.htpasswd
#   3. sudo docker exec jbs-nginx nginx -t && sudo docker exec jbs-nginx nginx -s reload
#
# 注意两点：
#   - 口令文件是 docker cp 进容器的，容器重建后会丢，需要重新执行第 2 步。
#     宿主机那份（/opt/jbs-hotsearch/deploy/nginx-watch.htpasswd）才是持久的。
#   - proxy_pass 用的是 docker0 网关 172.17.0.1，因为 watch 容器在 jbs-hotsearch
#     这个 compose 网络里，跟 jbs-nginx 所在的 jbs_jbs-net 不互通。
#     末位的 / 不能少，它负责把 /watch/ 前缀剥掉再转发，否则 watch 收到的
#     路径是 /watch/，路由匹配不到会 404。

location ^~ /watch/ {
    auth_basic "jbs watch";
    auth_basic_user_file /etc/nginx/watch.htpasswd;
    proxy_pass http://172.17.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
