# 把「评论聚合」挂到公网用的 nginx 反代片段。
#
# 背景：跟 nginx-watch.conf 一样的理由 —— watch 容器只在宿主机 8787 上，
# 公网直连 8787 被云安全组挡住（在阿里云上是不放行非常用端口的，且大盘页面
# 里**含内部地址**也不该直接放 8787）。把 watch 已经暴露在公网的方式是利用
# 同机的 jbs-nginx（80 端口），借它的 SPA 反代顺势捎一段 location 即可。
#
# 与 /watch/ 的差别：
#   - **不**加 basic auth：reviews 数据（店家榜、玩家评论原文）是米圈 App
#     上公开抓的，不含内部信息；与 /hotsearch/ /social/ 一致对外公开。
#   - URL 前缀 `/reviews/` 在反代里要保留（看 proxy_pass 末尾的 /reviews/），
#     否则 watch 收到的路径是 /<file> 而不是 /reviews/<file>，会 404。
#
# 用法（参考 nginx-watch.conf）：
#   1. 把下面 location 块插进 /opt/jbs/deploy/nginx.conf 的 server{ } 里，
#      位置必须在 `location / {...}`（SPA fallback）之前，否则被它吃掉。
#   2. sudo docker exec jbs-nginx nginx -t && sudo docker exec jbs-nginx nginx -s reload
#
# 验证：
#   curl -sS http://<server>/reviews/ | head    # 列表页 200
#   curl -sS -I http://<server>/reviews/<file>.html    # 单文件 200
#
# Docker 网络：reviews 跟 watch 一样跑在 jbs-hotsearch 的 compose 网络里，
# jbs-nginx 所在 jbs-net 不会与它互通，所以 proxy_pass 这里仍写宿主机的
# docker0 网关 172.17.0.1:8787，让 nginx 跨网络栈直连宿主机回环。

location ^~ /reviews/ {
    proxy_pass http://172.17.0.1:8787/reviews/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 评论文件小（最大几十 KB），但 LLM 摘要偶尔会有一两个拉长请求
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
