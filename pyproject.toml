[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jbs-hotsearch"
version = "0.1.0"
description = "剧本杀每日热门榜 Top10：可插拔数据源 + Supabase 落库 + 常驻调度"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    # 时区数据库：Windows 和精简版 Linux 镜像都没有系统 tz database，
    # 缺了它 zoneinfo 取 Asia/Shanghai 会直接抛 ZoneInfoNotFoundError
    "tzdata>=2024.1",
]

[project.scripts]
hotsearch = "jbs_hotsearch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
