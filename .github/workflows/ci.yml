name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install "ruff==0.16.6"

      # 规则统一写在 pyproject.toml 的 [tool.ruff.lint]，本地直接 `ruff check src/` 结果一致。
      # 里面 target-version = "py311" 是关键：它让我们在 3.12 的 runner 上
      # 依然能拦住「f-string 内用反斜杠转义」这种只有 3.12+ 才合法的写法
      # （本项目 requires-python = ">=3.11"）。
      - name: ruff
        run: ruff check --output-format=github src/

      - name: 全量编译
        run: python -m compileall -q src/

  smoke:
    name: 冒烟 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是 requires-python 声明的下限，必须真跑一遍：
        # 语法兼容问题只会在 import 时炸，compileall 用 3.12 跑是抓不到的。
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 刻意不 `pip install .`：httpx / playwright 又慢又重（还要拉 chromium），
      # 而 status / watch 已经做成延迟导入，零第三方依赖就能跑 ——
      # 「今天为什么没出榜」恰恰最可能发生在依赖装不上的机器上。
      # 用 PYTHONPATH 直接跑源码，顺带守住这条无依赖路径不被破坏。
      - name: 冒烟 status（无 .env，验证降级路径不崩）
        env:
          PYTHONPATH: src
          HS_WATCH_HTTP_TIMEOUT: "3"
        run: |
          set +e
          python -m jbs_hotsearch status --days 1 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          echo "status 退出码：$code"
          # 0 = 全绿；1 = 有需要关注的日子。
          # CI 里既没有 .env 也没有历史数据，落到 0 还是 1 取决于
          #「当前时间是否已过 HS_RUN_AT + 宽限」，两者都属正常。
          # 所以这里只拦「崩了」：出现未捕获异常，或退出码 > 1。
          if grep -q "Traceback" smoke.log; then
            echo "::error::冒烟出现未捕获异常，见上方输出"
            exit 1
          fi
          if [ "$code" -gt 1 ]; then
            echo "::error::status 退出码异常：$code"
            exit 1
          fi
          grep -q "jbs 每日任务" smoke.log \
            || { echo "::error::输出结构不符，渲染层可能坏了"; exit 1; }

      - name: JSON 输出可解析且结构完整
        env:
          PYTHONPATH: src
          HS_WATCH_HTTP_TIMEOUT: "3"
        run: |
          set +e
          python -m jbs_hotsearch status --days 1 --json > status.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error::status --json 退出码异常：$code"
            exit 1
          fi
          python -c "
          import json
          d = json.load(open('status.json', encoding='utf-8'))
          assert 'boards' in d, list(d)
          keys = [b.get('key') for b in d['boards']]
          assert keys == ['hotsearch', 'dm_ingest', 'seo_geo'], keys
          print('JSON OK，任务块：', keys)
          "
