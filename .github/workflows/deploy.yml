# 部署只能由「CI 跑绿」或「手动点」触发，用 workflow_run 而不是 push。
#
# 前置条件（其余什么都不用配）：
#   Secrets : SSH_HOST=101.34.58.31   SSH_USER=ubuntu   SSH_PORT=22   SSH_PRIVATE_KEY=<部署私钥>
#   可选变量: APP_DIR（默认 /opt/jbs-hotsearch）
#   服务器  : /opt/jbs-hotsearch 是 git clone，且能对 GitHub fetch
#             （仓库 public，服务器 ~/.ssh/config 里配了 jbs_deploy 部署密钥）
name: 部署

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 也支持手动点：Actions → 部署 → Run workflow
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 服务器重建容器
    runs-on: ubuntu-latest
    # 必须设上限：跨境 SSH 被静默掐断时，客户端收不到 RST，这一步会一直「进行中」
    # 直到默认的 6 小时任务超时。给 30 分钟，够一次构建，也够早失败。
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - name: 校验 Secrets 是否配齐
        run: |
          missing=0
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::缺 Secret：SSH_PRIVATE_KEY"; missing=1; }
          [ -n "$SSH_HOST" ]        || { echo "::error::缺 Secret：SSH_HOST"; missing=1; }
          # SSH_USER 必须显式给：下面的回退默认是 root，而本项目的服务器是 ubuntu，
          # 漏配会一路走到「Permission denied」才报错，不如在这里直接拦下。
          [ -n "$SSH_USER" ]        || { echo "::error::缺 Secret：SSH_USER（本项目填 ubuntu）"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::去 Settings → Secrets and variables → Actions 配上再跑"
            exit 1
          fi

      # 用 `bash xxx.sh` 而不是 `./xxx.sh`：后者依赖文件在仓库里的可执行位，
      # 一旦那个位丢了（在 Windows 上提交时很容易），远端就是 exit 126
      # 「Permission denied」—— 报得又晚又看不出是权限问题。
      # 不用第三方 ssh action：这一步只有二十行，自己写免掉一层供应链
      - name: 装 SSH 私钥
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: git pull + 重建容器
        run: |
          # ServerAliveInterval 必须给：构建那一层要跑好几分钟，链路中间任何一层
          # NAT 看它「静默」就会把长连接掐掉，构建被 SIGHUP 一起杀掉，
          # 表现为 Actions 里这一步无限挂起（连接已死，但客户端收不到 RST）。
          ssh -i ~/.ssh/id_ed25519 -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              "${SSH_USER:-root}@$SSH_HOST" \
              "cd ${APP_DIR:-/opt/jbs-hotsearch} && git pull --ff-only && bash deploy/server-deploy.sh docker update"

      # 只确认「服务活着并应答」，不把「今天还没出榜」判成部署失败：
      # 200 = 今天已出榜；503 = 今天没出榜（可能只是没到点），两者都说明大盘是活的。
      - name: 部署后探活
        run: |
          code=$(ssh -i ~/.ssh/id_ed25519 -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes \
                 -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                 "${SSH_USER:-root}@$SSH_HOST" \
                 'curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8787/healthz' \
                 || echo "000")
          echo "healthz 返回：$code"
          case "$code" in
            200) echo "✓ 大盘应答，今天已出榜" ;;
            503) echo "✓ 大盘应答，今天还没出榜（正常，等定时任务）" ;;
            *)   echo "::error::大盘没应答（$code），部署可能失败，上服务器看 docker compose logs"; exit 1 ;;
          esac

      - name: 清场
        if: always()
        run: rm -f ~/.ssh/id_ed25519
