services:
  hotsearch:
    build: .
    image: jbs-hotsearch:latest
    container_name: jbs-hotsearch
    restart: unless-stopped
    # 容器里的时间必须是北京时间，否则 HS_RUN_AT=09:00 会按 UTC 触发（= 北京时间 17 点）
    environment:
      TZ: Asia/Shanghai
      HS_DATA_DIR: /app/data
      HS_SOURCE_MIQUAN_CURLS_FILE: /app/data/miquan_curls.txt
    env_file: .env
    volumes:
      # 左换成服务器上的绝对路径也行；data/ 里的 miquan_curls.txt 是必需输入，不要删
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 监听大盘：只读 Supabase 的运行日志，不出榜、不抢调度器的活。
  # 单独一个容器，是为了让「出榜的」和「看出榜的」互不影响 ——
  # 出榜挂了的时候，大盘必须还活着，否则连挂了都不知道。
  watch:
    build: .
    image: jbs-hotsearch:latest
    container_name: jbs-hotsearch-watch
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      HS_DATA_DIR: /app/data
      # 容器里必须绑 0.0.0.0，否则外面访问不到
      HS_WATCH_HOST: 0.0.0.0
      HS_WATCH_PORT: 8787
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8787:8787"
    # 今天出榜成功 / 还没到点 = 200；失败或缺跑 = 503（容器会被标 unhealthy）
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=10).status == 200 else 1)"]
      interval: 15m
      timeout: 20s
      retries: 2
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
