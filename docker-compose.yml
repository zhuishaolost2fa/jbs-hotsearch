services:
  hotsearch:
    build: .
    image: jbs-hotsearch:latest
    container_name: jbs-hotsearch
    restart: unless-stopped
    # 容器里的时间必须是北京时间，否则 HS_RUN_AT=09:00 会按 UTC 触发（= 北京时间 17 点）
    environment:
      TZ: Asia/Shanghai
      HS_DATA_DIR: /app/data
      # 抓包凭据优先从挂载的 /app/creds 读；该目录由下面的 HS_CREDS_DIR 变量决定
      HS_SOURCE_MIQUAN_CURLS_FILE: /app/creds/miquan_curls.txt
    env_file: .env
    volumes:
      - ./data:/app/data
      # 抓包凭据是可再生但易丢的敏感输入（含 usertoken+sign），放仓库外避免被
      # git 操作误删（git clean -fdx 会删掉 gitignore 的 data/*.txt）。
      # 服务器在 .env 里设 HS_CREDS_DIR=/opt/jbs-hotsearch-creds；本地默认 ./data。
      - ${HS_CREDS_DIR:-./data}:/app/creds:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 监听大盘：只读 Supabase 的运行日志，不出榜、不抢调度器的活。
  # 单独一个容器，是为了让「出榜的」和「看出榜的」互不影响 ——
  # 出榜挂了的时候，大盘必须还活着，否则连挂了都不知道。
  watch:
    # 用专用轻量镜像（Dockerfile.watch），不装 playwright ——
    # 出榜镜像光 apt 拉 chromium 依赖就要十几分钟，大盘不需要，改一行大盘代码不该等那么久
    build:
      context: .
      dockerfile: Dockerfile.watch
    image: jbs-hotsearch-watch:latest
    container_name: jbs-hotsearch-watch
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      HS_DATA_DIR: /app/data
      # 容器里必须绑 0.0.0.0，否则外面访问不到
      HS_WATCH_HOST: 0.0.0.0
      HS_WATCH_PORT: 8787
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8787:8787"
    # 今天出榜成功 / 还没到点 = 200；失败或缺跑 = 503（容器会被标 unhealthy）
    #
    # 超时必须给足：快照缓存只有 20s，而健康检查 15 分钟一次，等于每次都是冷启动
    # —— 要重新查 Supabase + 探测 5 个 SEO 产物，实测 10s 出头。
    # 之前脚本里写 timeout=10，正好卡在边界上必然超时，容器一直 unhealthy。
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=30).status == 200 else 1)"]
      interval: 15m
      timeout: 45s
      retries: 2
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
